name: Watch rules sources for changes

# Weekly: fetch only Wahapedia's Last_update.csv and ask GitHub whether BSData changed the catalogues
# we read. When either has moved on from the reviewed sources, open an issue assigned to the repo
# owner, which GitHub emails them. Nothing is downloaded beyond that one small file.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Fetch Last_update.csv
        run: >-
          yarn data:candidate
          --wahapedia-url https://wahapedia.ru/wh40k11ed/Last_update.csv
          --output .cache/wh40k11e/candidates/watch

      - name: Compare with the reviewed sources
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: yarn data:watch --candidate .cache/wh40k11e/candidates/watch --summary watch-summary.md

      - name: Open an issue
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title='Rules data sources changed'
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "An open issue already tracks this."
            exit 0
          fi
          gh issue create --title "$title" --assignee "$OWNER" --body-file watch-summary.md
