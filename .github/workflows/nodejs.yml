name: Lint, Test, and Build

# Pushes to master are checked by pages.yml before it deploys; this covers other branches and PRs.
on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]

env:
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies with yarn
        run: yarn install --frozen-lockfile

      - name: Lint with eslint
        run: yarn lint

      # Build before test. src/tests/pwaBuild.test.ts asserts on the generated service worker and
      # manifest, and `dist/` is gitignored -- with the old ordering those assertions had nothing to
      # read on a clean checkout.
      - name: Build with TypeScript
        run: yarn build

      - name: Test with vitest
        run: yarn test --run
